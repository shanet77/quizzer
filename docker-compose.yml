services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - quizdata:/data
    expose:
      - "3000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
volumes:
  quizdata:
  caddydata:
  caddyconfig:
