name: Deploy quizzer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: linux-amd64
    steps:
      - name: Deploy to RackNerd
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH secret — set to /home/deployer/project/quizzer}"

          if [ -z "${DEPLOY_PORT:-}" ]; then DEPLOY_PORT="22"; fi

          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          if [ -n "${DEPLOY_SSH_KEY:-}" ]; then
            KEY_PATH="$HOME/.ssh/id_ed25519"
            printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY_PATH"; chmod 600 "$KEY_PATH"
          elif [ -f "$HOME/.ssh/forgejo_deploy" ]; then
            KEY_PATH="$HOME/.ssh/forgejo_deploy"; chmod 600 "$KEY_PATH"
          else
            echo "Missing DEPLOY_SSH_KEY secret and no $HOME/.ssh/forgejo_deploy key on runner."; exit 1
          fi
          if [ -n "${DEPLOY_HOST_KEY:-}" ]; then
            printf '%s\n' "$DEPLOY_HOST_KEY" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          SSH_OPTS="-i $KEY_PATH -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $DEPLOY_PORT"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "export DEPLOY_PATH='$DEPLOY_PATH'; bash -s" <<'EOF_REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch --prune origin main
          git checkout --force FETCH_HEAD
          echo "Deploying commit: $(git rev-parse HEAD)"
          podman network exists hoopnerd-edge || podman network create hoopnerd-edge
          podman build --tag localhost/quizzer:local .
          QUADLET_DIR="$HOME/.config/containers/systemd"
          mkdir -p "$QUADLET_DIR"
          for f in quadlet/*.container quadlet/*.volume; do
            [ -f "$f" ] || continue
            ln -sf "$DEPLOY_PATH/$f" "$QUADLET_DIR/$(basename "$f")"
          done
          systemctl --user daemon-reload
          systemctl --user restart quizzer.service
          sleep 3
          systemctl --user is-active quizzer.service
          podman ps --filter name=quizzer
          EOF_REMOTE
